<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="../static/app_tela/styles.css">
</head>
<body>
  <main class="container">
    <h1>Cadastro de Usuário</h1>

    <form method="post" action="#" class="form-card" novalidate>
      <label>
        Nome
        <input type="text" name="name" placeholder="Seu nome" required>
      </label>

      <label>
        Email
        <input type="email" name="email" placeholder="seu@exemplo.com" required>
      </label>

      <label>
        Idade
        <input type="number" name="age" min="0" placeholder="0" required>
      </label>

      <button type="submit" class="btn">Cadastrar</button>
    </form>
  </main>
</body>
</html>
